      - name: Install iOS platform SDK
        # Best-effort only — must never fail the build. On macos-26 the iOS 26
        # platform is preinstalled, so this is a no-op top-up; `-downloadPlatform`
        # is flaky there and can abort with "Unable to connect to simulator"
