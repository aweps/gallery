  filter:
    name: Filter builds
    if: |
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.pull_request.title, 'ci skip') &&
      !github.event.pull_request.head.repo.fork

    runs-on: ubuntu-latest
    outputs:
      skip-ios: "${{ steps.check.outputs.skip-ios }}"
      skip-android: "${{ steps.check.outputs.skip-android }}"
    steps:
      - name: Reclaim self-hosted workspace (pre-checkout)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -uo pipefail
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uid="$(id -u)"; gid="$(id -g)"
          # Reused self-hosted workspaces accumulate root-owned files from prior
          # docker-as-root jobs, so actions/checkout fails to clean them (EACCES).
          # Reclaim ownership so checkout can proceed. Linux self-hosted has docker
          # (used for builds); macOS self-hosted has passwordless sudo but no docker.
          # Hosted runners are ephemeral, so runner.environment guards this out.
          # Only Linux self-hosted has a docker daemon (it runs the builds); use a
          # root container there to reclaim. macOS self-hosted (bolt-2) has the
          # docker CLI but NO daemon, so `docker run` HANGS (and `|| true` can't
          # guard a hang) -- restrict the container path to Linux and bound it;
          # macOS reclaims via passwordless sudo. (2026-07-23: this step wedged
          # every bolt-2 iOS build for >1h before the uname guard.)
          if [ "$(uname -s)" = "Linux" ] && command -v docker >/dev/null 2>&1; then
            timeout 120 docker run --rm -v "$ws:/ws" alpine:3.20 chown -R "$uid:$gid" /ws || true
          fi
          sudo chown -R "$uid:$gid" "$ws" 2>/dev/null || chown -R "$uid:$gid" "$ws" 2>/dev/null || true

      - name: Check out code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab #v3.5.2
        with:
          fetch-depth: 0

      - name: gate-check
        id: check
        run: |
          set -x
          # Allow specialized builds on only tagged builds or master builds. For master, check associated tag to allow specific builds. This check happens in the filter job.
          # Add: Test for tag existance to allow master-only tag-less ios/android builds
          if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/hotfix/"* ]] && [[ "$(git describe --tags --exact-match HEAD)" != "mobile/"* ]] && [[ "$(git describe --tags --exact-match HEAD)" != "ios/"* ]]; then
            echo "skip-ios=true" >> $GITHUB_OUTPUT
          else
            echo "skip-ios=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/hotfix/"* ]] && [[ "$(git describe --tags --exact-match HEAD)" != "mobile/"* ]] && [[ "$(git describe --tags --exact-match HEAD)" != "android/"* ]]; then
            echo "skip-android=true" >> $GITHUB_OUTPUT
          else
            echo "skip-android=false" >> $GITHUB_OUTPUT
          fi

  build-web:
    needs:
      - pick-runner

    name: Build & package builds for Web
    if: |
      always() &&
      !contains(github.event.head_commit.message, 'ci skip') &&
      !contains(github.event.pull_request.title, 'ci skip') &&
      !github.event.pull_request.head.repo.fork

    runs-on: ${{ fromJSON(needs.pick-runner.outputs.linux || '["ubuntu-latest"]') }}
    env:
      DEBUG: ${{ github.event.inputs.DEBUG }}
      WAIT_ON_ERROR: ${{ github.event.inputs.WAIT_ON_ERROR }}
    steps:
      - name: Reclaim self-hosted workspace (pre-checkout)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -uo pipefail
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uid="$(id -u)"; gid="$(id -g)"
          # Reused self-hosted workspaces accumulate root-owned files from prior
          # docker-as-root jobs, so actions/checkout fails to clean them (EACCES).
          # Reclaim ownership so checkout can proceed. Linux self-hosted has docker
          # (used for builds); macOS self-hosted has passwordless sudo but no docker.
          # Hosted runners are ephemeral, so runner.environment guards this out.
          # Only Linux self-hosted has a docker daemon (it runs the builds); use a
          # root container there to reclaim. macOS self-hosted (bolt-2) has the
          # docker CLI but NO daemon, so `docker run` HANGS (and `|| true` can't
          # guard a hang) -- restrict the container path to Linux and bound it;
          # macOS reclaims via passwordless sudo. (2026-07-23: this step wedged
          # every bolt-2 iOS build for >1h before the uname guard.)
          if [ "$(uname -s)" = "Linux" ] && command -v docker >/dev/null 2>&1; then
            timeout 120 docker run --rm -v "$ws:/ws" alpine:3.20 chown -R "$uid:$gid" /ws || true
          fi
          sudo chown -R "$uid:$gid" "$ws" 2>/dev/null || chown -R "$uid:$gid" "$ws" 2>/dev/null || true

      - name: Check out code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab #v3.5.2

      - name: Expose GitHub Runtime for docker buildx to use gha cache
        uses: crazy-max/ghaction-github-runtime@056b8ec6661ce03a987ab8643a0edc346ae63fe3 #v2.2.0

      - name: docker
        uses: docker://docker:29.6.2@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
        with:
          args: /bin/sh -c "apk update && apk add bash && /bin/bash _ops/ci.build.sh web"
        env:
          SECRETS_B64_DEV: ${{ secrets.SECRETS_B64_DEV }}
          SECRETS_B64_PROD: ${{ secrets.SECRETS_B64_PROD }}
          GITHUB_PR_SHA: ${{ github.event.pull_request.head.sha }}

  build-android:
    needs:
      - filter
      - pick-runner

    name: Build & package builds for Android
    if: |
      always() &&
      !contains(github.event.head_commit.message, 'ci skip') &&
