        with:
          key: flutter-archive-${{ env.FLUTTER_VER }}
          path: |
            ~/Flutter/flutter_macos_${{ env.FLUTTER_VER }}-stable.zip

      - name: Restore Flutter dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f #v3.4.3
        with:
          path: ~/Flutter/flutter
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VER }}

      - name: build
        run: /bin/bash runner ios-build release
        env:
          SECRETS_B64_DEV: ${{ secrets.SECRETS_B64_DEV }}
          SECRETS_B64_PROD: ${{ secrets.SECRETS_B64_PROD }}
          GITHUB_PR_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Package ios image locally (self-hosted has a docker daemon)
        # Self-hosted mac has a local docker daemon, so build+push the -ios
        # carrier image here instead of round-tripping the archive through
        # GitHub's cache to a linux runner (no-remote-cache-on-self-hosted rule).
        # DOCKER_DEFAULT_PLATFORM pins linux/amd64 to match the hosted-built
        # artifact on this arm64 mac; BUILDX_NO_DEFAULT_ATTESTATIONS keeps it a
        # single-platform image like machzero produces. Hosted macos-26 has NO
        # docker, so it still hands off to package-ios (gated on self_hosted).
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          # Homebrew docker CLI + a PATH WITHOUT /usr/local/bin so
          # docker-credential-osxkeychain is unreachable: the docker CLI defaults
          # credsStore to osxkeychain on macOS whenever that helper is on PATH, and
          # that HANGS (credsStore=desktop) or fails (Keychain Error -61) in a
          # headless runner. With no helper on PATH the CLI stores creds inline
          # (fine for a dedicated CI runner); a fresh DOCKER_CONFIG also dodges
          # Docker Desktop's credsStore=desktop in ~/.docker/config.json.
          export PATH="/opt/homebrew/bin:/usr/bin:/bin"
          export DOCKER_CONFIG="${RUNNER_TEMP:-/tmp}/docker-ci"
          mkdir -p "$DOCKER_CONFIG"
          /bin/bash _ops/ci.build.sh ios
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          SECRETS_B64_DEV: ${{ secrets.SECRETS_B64_DEV }}
          SECRETS_B64_PROD: ${{ secrets.SECRETS_B64_PROD }}
          GITHUB_PR_SHA: ${{ github.event.pull_request.head.sha }}

