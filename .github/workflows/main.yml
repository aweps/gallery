      WAIT_ON_ERROR: ${{ github.event.inputs.WAIT_ON_ERROR }}
    steps:
      - name: Reclaim self-hosted workspace (pre-checkout)
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
