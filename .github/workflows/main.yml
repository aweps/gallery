name: Build Flutter App

on:
  push:
    branches: [main, master, hotfix/*]
    # Pattern matched against refs/tags (path filters are not evaluated for tag pushes)
    tags:
      - "**" # Push events to every tag including hierarchical tags like v1.0/beta
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      DEBUG:
        required: true
        default: "false"
      WAIT_ON_ERROR:
        required: true
        default: "true"

jobs:
  pick-runner:
    name: Pick runner
